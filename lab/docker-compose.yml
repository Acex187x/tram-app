# Tram Spotter prediction engine (the "lab" name is historical — this IS the
# production backend half that turns Convex fixes into published trajectories):
#
#   lab      lab/src/main.ts — ingests the Convex fix stream, learns pace/dwell
#            surfaces online, asks the ML service for horizons, builds drive-v3
#            curves and PUBLISHES them into Convex (trajectories:publish) +
#            uploads the cold-start geometry pack. Archives fixes in SQLite.
#   ml       lab/ml/service.py — LightGBM/MLP inference, retrained nightly
#            (02:00 UTC) on the fix archive.
#   grafana  "Tram Engine — Production Health" dashboard over the same SQLite.
#
# Run from this directory (the checkout is mounted read-only at /repo):
#   docker compose -p tram-lab up -d
#
# Public routes (file /etc/dokploy/traefik/dynamic/tram-lab.yml):
#   https://tram-lab.acex.sh          → /api/summary, /api/vehicle/:key/debug (devtools)
#   https://tram-lab-grafana.acex.sh  → Grafana (login: admin / .env password)
#
# Data: volume tram-lab_lab-data = /data/lab.db (fix archive, learned surfaces,
# scores, rollups) + /data/models (trained artefacts). Keep it.

services:
  lab:
    image: node:22-bookworm
    container_name: tram-lab
    working_dir: /repo
    command: bash -lc "cd /repo/lab && npm ci --no-audit --no-fund && exec ./node_modules/.bin/tsx src/main.ts"
    environment:
      TSX_TSCONFIG_PATH: /repo/lab/tsconfig.runtime.json
      LAB_DB: /data/lab.db
      LAB_PORT: "8090"
      CONVEX_URL: http://tram-convex-backend:3210
      SITE_URL: http://tram-convex-backend:3211
      ML_URL: http://tram-lab-ml:8092
      # Which generator the published chain emits (1 = drive-v3, production
      # since 2026-08-21) and the shared secret for trajectories:publish.
      # Values live in lab/.env on the deployment.
      TRAJ_V3_PUBLISH: "${TRAJ_V3_PUBLISH:-0}"
      ENGINE_PUSH_TOKEN: "${ENGINE_PUSH_TOKEN:-}"
      # Opt-in research flags (both must match the ML service):
      #   ML_FEATURE_VERSION=4  — v4 motion features (needs ML retrain)
      #   TRAJ_CONTINUOUS_V1=1  — continuous-v1 motion policy on the wire
      ML_FEATURE_VERSION: "${ML_FEATURE_VERSION:-3}"
      TRAJ_CONTINUOUS_V1: "${TRAJ_CONTINUOUS_V1:-0}"
    volumes:
      - ../:/repo:ro
      - lab-node-modules:/repo/lab/node_modules
      - lab-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -sf http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s

  ml:
    image: python:3.12-slim
    container_name: tram-lab-ml
    working_dir: /repo/lab/ml
    command: bash -lc "apt-get update -qq && apt-get install -y -qq libgomp1 >/dev/null && pip install --no-cache-dir -q lightgbm scikit-learn pandas joblib && exec python service.py"
    environment:
      LAB_DB: /data/lab.db
      MODELS_DIR: /data/models
      ML_PORT: "8092"
      ML_FEATURE_VERSION: "${ML_FEATURE_VERSION:-3}"
    volumes:
      - ../:/repo:ro
      - lab-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    networks:
      - dokploy-network

  grafana:
    image: grafana/grafana-oss:11.6.3
    container_name: tram-lab-grafana
    environment:
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${LAB_GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://tram-lab-grafana.acex.sh
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - lab-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    networks:
      - dokploy-network

volumes:
  lab-node-modules:
  lab-data:
  grafana-data:

networks:
  dokploy-network:
    external: true
