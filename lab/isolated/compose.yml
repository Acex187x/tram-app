name: tram-tracking-candidate
services:
  convex:
    image: ghcr.io/get-convex/convex-backend@sha256:1f2044e3eac463ac78973b136c0baf72d4ada602611d853d6f99f280e29e0a98
    ports:
      - '10.10.10.1:13210:3210'
      - '10.10.10.1:13211:3211'
    environment:
      INSTANCE_NAME: tram-tracking-candidate
      CONVEX_CLOUD_ORIGIN: http://10.10.10.1:13210
      CONVEX_SITE_ORIGIN: http://10.10.10.1:13211
      DO_NOT_REQUIRE_SSL: '1'
      DISABLE_BEACON: '1'
      # Candidate curves are ephemeral; bound MVCC history as well as app rows.
      DOCUMENT_RETENTION_DELAY: '3600'
    volumes:
      - convex-data:/convex/data
    mem_limit: 3g
    memswap_limit: 4g
    cpus: 1.0
    restart: unless-stopped
  ml:
    image: python:3.12-slim
    working_dir: /artifact/ml
    command: ['bash', '-lc', 'apt-get update -qq && apt-get install -y -qq libgomp1 >/dev/null && pip install --no-cache-dir -q -r requirements-candidate.txt && exec python service.py']
    environment:
      MODELS_DIR: /models
      ML_TRAIN_ENABLED: '0'
      ML_PORT: '8092'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    volumes:
      - ./artifact:/artifact:ro
      - ./models:/models:ro
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
  lab:
    image: node:22-bookworm
    working_dir: /artifact
    command: ['bash', '-lc', 'set -e; test -f /runtime/node_modules/better-sqlite3/package.json || npm install --prefix /runtime --no-audit --no-fund better-sqlite3@11.10.0; exec node lab.cjs']
    ports:
      - '10.10.10.1:18090:8090'
    environment:
      CONVEX_URL: https://tram-api.acex.sh
      SITE_URL: https://tram-site.acex.sh
      STOP_SERVICE_METADATA_FILE: /data/stop-service.json
      STOP_SERVICE_REFRESH_SCRIPT: /artifact/gtfs_stop_service.py
      PUBLISH_CONVEX_URL: http://convex:3210
      ENGINE_PUSH_TOKEN: ${ENGINE_PUSH_TOKEN:?Generate a new candidate-only token}
      ML_URL: http://ml:8092
      LAB_DB: /data/lab.db
      LAB_PORT: '8090'
      NODE_PATH: /runtime/node_modules
      TRAJ_V3_PUBLISH: '1'
    volumes:
      - ./artifact:/artifact:ro
      - node-runtime:/runtime
      - lab-data:/data
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
volumes:
  convex-data:
    name: tram-tracking-candidate-convex-v2-20260906
  lab-data:
  node-runtime:
